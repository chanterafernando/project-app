[project]
name = "thesis-management-api"
version = "0.1.0"
requires-python = ">=3.12"

# ---------- Ruff: lint / análisis estático ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores (variables sin usar, imports sin usar…)
# I: orden de imports · B: errores comunes · UP: sintaxis moderna de Python
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...) en parámetros es el patrón normal de FastAPI

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
